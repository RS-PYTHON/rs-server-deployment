# -- Namespace for the deployment
namespace: processing

# -- Number of replicas for the deployment
replicaCount: 1

service:
  # -- Port for the service
  port: 8080

app:
  # -- Port for the application
  port: 8000
  # -- Working directory for the application
  workDir: /app
  # -- Config directory for the application
  confDir: /app/conf
  # -- Station configuration file for the application
  stationConfigFile: stations_cfg.json
  adgsSearchConfigFile: adgs_search_config.yaml
  # -- EODAG configuration file for the application. Set properly the EODAG_ADGS_CONFIG env var.
  eodagConfigFile: adgs_ws_config.yaml
  station:
    adgs:
      endpoint: {{ rs_server_station_secrets.stations.adgs.service.url }}
      configFile: adgs_service_config.yaml

  # -- URL of the API Key Manager service
  uacURL: http://apikeymanager.processing.svc.cluster.local:8000/auth/check_key

auth:
  secret:
    # -- OIDC End Point
    oidc_endpoint: "https://iam.{{ platform_domain_name }}"
    # -- OIDC Realm
    oidc_realm: "rspy"
    # -- OIDC CLient ID
    oidc_client_id: "apikeymanager"
    # -- OIDC Secret used to sync user info from Keycloak
    oidc_client_secret: "{{ apikeymanager_oidc_client_secret }}"
    # -- Random string used to encode cookie-based HTTP sessions in SessionMiddleware
    cookie_secret: "{{ rsserver_cookieSecret }}"

gatewayapi:
  # -- Enabled/Disable Gateway API
  enabled: true
  # -- HTTPRoute parentRefs, can either be a ListenerSet or a Gateway
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: ListenerSet
    name: processing
    namespace: processing
  # -- HTTPRoute host name
  host: {{ rs_server.full_domain }}
  # -- HTTPRoute path for the application
  path:
    - /adgs
    - /auxip

resources:
  request:
    # -- Pod memory request
    ram: "256Mi"
    # -- Pod CPU request
    cpu: "100m"
  limit:
    # -- Pod memory limit
    ram: "1000Mi"
    # -- Pod CPU limit
    cpu: "500m"

# -- Pod affinity
affinity:
  nodeAffinity:
   requiredDuringSchedulingIgnoredDuringExecution:
     nodeSelectorTerms:
     - matchExpressions:
       - key: node-role.kubernetes.io/access_csc
         operator: Exists

# -- Pod toleration
tolerations:
  - key: role
    value: access_csc
    effect: NoSchedule

# -- Pod initContainers
initContainers:
  - name: init-check
    image: alpine/curl:latest
    command:
      - /bin/sh
      - -c
      - |
        until test "$(curl -XGET --silent http://alloy.monitoring.svc.cluster.local:12345/-/ready)" = "Alloy is ready."; do echo Alloy is not ready; sleep 2; done; echo Alloy reached

cors:
  # -- A list of origins that should be permitted to make cross-origin requests. Needed for STAC Browser
  origins: https://stac-browser-auxip.{{ platform_domain_name }},http://localhost:8080
