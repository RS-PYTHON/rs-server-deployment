# -- Namespace for the deployment
namespace: processing

app:
  # -- Port for the application
  port: 8000
  # -- Working directory for the application
  workDir: /app
  # -- Config directory for the application
  confDir: /app/conf
  # -- Station configuration file for the application
  stationConfigFile: stations_cfg.json
  # -- Cadip search configuration file for the application
  cadipSearchConfigFile: cadip_search_config.yaml
  # -- EODAG configuration file for the application. If useTokenModule is true the adgs_ws_config_token_module.yaml
  # -- shall be used. When useTokenModule is false, the adgs_ws_config.yaml shall be used.
  # -- Set properly the EODAG_ADGS_CONFIG env var.
  eodagConfigFile: cadip_ws_config.yaml
  eodagConfigFileTokenModule: cadip_ws_config_token_module.yaml
  # -- The method for loading the token for external stations: use the custom module or
  # -- allow EODAG to handle it (set it to false for EODAG).
  useTokenModule: false
  station:
    ssc:
      endpoint:
        url:
          token: {{ rs_server_station_secrets.stations.ssc.authentication.token_url }}
          odata: {{ rs_server_station_secrets.stations.ssc.service.url }}
    ins:
      endpoint:
        url:
          token: {{ rs_server_station_secrets.stations.ins.authentication.token_url }}
          odata: {{ rs_server_station_secrets.stations.ins.service.url }}
    mps:
      endpoint:
        url:
          token: {{ rs_server_station_secrets.stations.mps.authentication.token_url }}
          odata: {{ rs_server_station_secrets.stations.mps.service.url }}
    mti:
      endpoint:
        url:
          token: {{ rs_server_station_secrets.stations.mti.authentication.token_url }}
          odata: {{ rs_server_station_secrets.stations.mti.service.url }}
    nsg:
      endpoint:
        url:
          token: {{ rs_server_station_secrets.stations.nsg.authentication.token_url }}
          odata: {{ rs_server_station_secrets.stations.nsg.service.url }}
    sgs:
      endpoint:
        url:
          token: {{ rs_server_station_secrets.stations.sgs.authentication.token_url }}
          odata: {{ rs_server_station_secrets.stations.sgs.service.url }}
    kse:
      endpoint:
        url:
          token: {{ rs_server_station_secrets.stations.kse.authentication.token_url }}
          odata: {{ rs_server_station_secrets.stations.kse.service.url }}
    par:
      endpoint:
        url:
          token: {{ rs_server_station_secrets.stations.par.authentication.token_url }}
          odata: {{ rs_server_station_secrets.stations.par.service.url }}

  # -- URL of the API Key Manager service
  uacURL: http://apikeymanager.processing.svc.cluster.local:8000/auth/check_key

auth:
  secret:
    # -- OIDC End Point
    oidc_endpoint: "https://iam.{{ platform_domain_name }}"
    # -- OIDC Realm
    oidc_realm: "rspy"
    # -- OIDC CLient ID
    oidc_client_id: "apikeymanager"
    # -- OIDC Secret used to sync user info from Keycloak
    oidc_client_secret: "{{ apikeymanager_oidc_client_secret }}"
    # -- Random string used to encode cookie-based HTTP sessions in SessionMiddleware
    cookie_secret: "{{ rsserver_cookieSecret }}"

obs:
  # -- URL of the object storage service endpoint
  endpoint: {{ s3.endpoint }}
  # -- Region of the object storage service
  region: {{ s3.region }}
  secret:
    # -- Access Key to authenticate with the object storage service
    ak: {{ s3.access_key }}
    # -- Secret Key to authenticate with the object storage service
    sk: {{ s3.secret_key }}

ingress:
  # -- Enabled/Disable ingress
  enabled: true
  issuer:
    # -- Ingress Issuer type
    type: cluster-issuer
    # -- Ingress Issuer name
    name: "{{ cluster_issuer }}"
  # -- Ingress host name
  host: {{ rs_server.full_domain }}
  # -- Ingress path
  path: /cadip

resources:
  request:
    # -- Pod memory request
    ram: "256Mi"
    # -- Pod CPU request
    cpu: "100m"
  limit:
    # -- Pod memory limit
    ram: "1000Mi"
    # -- Pod CPU limit
    cpu: "500m"

# -- Pod affinity
affinity:
  nodeAffinity:
   requiredDuringSchedulingIgnoredDuringExecution:
     nodeSelectorTerms:
     - matchExpressions:
       - key: node-role.kubernetes.io/access_csc
         operator: Exists

# -- Pod toleration
tolerations:
  - key: role
    value: access_csc
    effect: NoSchedule

# -- Pod initContainers
initContainers:
  - name: init-check
    image: alpine/curl:latest
    command:
      - /bin/sh
      - -c
      - |
        until test "$(curl -XGET --silent http://alloy.monitoring.svc.cluster.local:12345/-/ready)" = "Alloy is ready."; do echo Alloy is not ready; sleep 2; done; echo Alloy reached

cors:
  # -- A list of origins that should be permitted to make cross-origin requests. Needed for STAC Browser
  origins: https://stac-browser-cadip.{{ platform_domain_name }},http://localhost:8080
