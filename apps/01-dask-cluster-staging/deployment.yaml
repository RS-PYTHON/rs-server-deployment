apiVersion: apps/v1
kind: Deployment
metadata:
  name: dask-cluster-launcher
spec:
  selector:
    matchLabels:
      app: dask-cluster-launcher
  template:
    metadata:
      labels:
        app: dask-cluster-launcher
    spec:
      containers:
      - args:
        - pip install dask==2026.3.0 dask-gateway==2025.4.0 numpy==2.4.3 && python /scripts/script.py
        command:
        - /bin/sh
        - -c
        image: python:3.13.12-slim
        name: dask-launcher
        resources:
          limits:
            memory: 256Mi
          requests:
            memory: 2Mi
        volumeMounts:
        - mountPath: /scripts
          name: script-volume
        envFrom:
        - secretRef:
            name: dask-cluster-staging
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
      volumes:
      - configMap:
          name: dask-cluster-script
        name: script-volume
