# The platform wildcard DNS points at NGINX. Keep the same hostname and API
# available here while also publishing the Envoy route for the gateway migration.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: '{{ app_name }}'
  namespace: processing
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: 'off'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
spec:
  ingressClassName: nginx
  rules:
    - host: 'dpr-mockup.{{ platform_domain_name }}'
      http:
        paths:
          - path: /dpr
            pathType: Prefix
            backend:
              service:
                name: '{{ app_name }}'
                port:
                  number: 8080
  tls:
    - hosts:
        - 'dpr-mockup.{{ platform_domain_name }}'
      # This certificate is managed by the ListenerSet's cert-manager annotation.
      secretName: 'dpr-mockup-{{ platform_domain_name | replace(".", "-") }}'
