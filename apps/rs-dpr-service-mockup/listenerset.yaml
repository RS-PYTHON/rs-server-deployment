apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: '{{ app_name }}'
  namespace: processing
  annotations:
    # DNS currently points at NGINX; use its HTTP-01 solver for the shared certificate.
    cert-manager.io/cluster-issuer: '{{ rs_dpr_mockup_cluster_issuer | default("letsencrypt-prod") }}'
spec:
  parentRef:
    name: envoy
    namespace: envoy-gateway
    group: gateway.networking.k8s.io
    kind: Gateway
  listeners:
    - name: https
      hostname: 'dpr-mockup.{{ platform_domain_name }}'
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
      tls:
        mode: Terminate
        certificateRefs:
          - name: 'dpr-mockup-{{ platform_domain_name | replace(".", "-") }}'
            kind: Secret
