apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: {{ rs_performance_indicator.database.name }}
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  allowCrossNamespaceImport: true
  datasource:
    name: Postgres-performance
    type: postgres
    access: proxy
    url: {{ rs_performance_indicator.database.host }}
    user:  {{ rs_performance_indicator.database.username }}
    secureJsonData:
      password: '{{ rs_performance_indicator.database.password }}'
    isDefault: false
    jsonData:
      database: {{ rs_performance_indicator.database.name }}
      sslmode: require
      "tlsSkipVerify": true
      "timeInterval": "5s"
