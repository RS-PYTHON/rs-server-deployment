# -- Namespace for the deployment
namespace: processing

# -- Number of replicas for the deployment
replicaCount: 1

service:
  # -- Port for the service
  port: 8080

app:
  # -- Port for the application
  port: 8000
  # -- Config directory for the application
  confDir: /app/conf
  # -- Station configuration file for the application
  stationConfigFile: stations_cfg.json
  pripSearchConfigFile: prip_search_config.yaml
  # -- EODAG configuration file for the application. Set properly the EODAG_PRIP_CONFIG env var.
  eodagConfigFile: prip_ws_config.yaml
  ptypeMappingFile: product_type_mapping.yaml
  station:
    s1a:
      endpoint: {{ rs_server_station_secrets.stations.s1a.service.url }}
      configFile: s1a_service_config.yaml
    s1c:
      endpoint: {{ rs_server_station_secrets.stations.s1c.service.url }}
      configFile: s1c_service_config.yaml
    s1d:
      endpoint: {{ rs_server_station_secrets.stations.s1d.service.url }}
      configFile: s1d_service_config.yaml
    s2b:
      endpoint: {{ rs_server_station_secrets.stations.s2b.service.url }}
      configFile: s2b_service_config.yaml
    s2c:
      endpoint: {{ rs_server_station_secrets.stations.s2c.service.url }}
      configFile: s2c_service_config.yaml
    s3a:
      endpoint: {{ rs_server_station_secrets.stations.s3a.service.url }}
      configFile: s3a_service_config.yaml
    s3b:
      endpoint: {{ rs_server_station_secrets.stations.s3b.service.url }}
      configFile: s3b_service_config.yaml

  # -- URL of the API Key Manager service
  uacURL: http://apikeymanager.processing.svc.cluster.local:8000/auth/check_key

auth:
  secret:
    # -- OIDC End Point
    oidc_endpoint: "https://iam.{{ platform_domain_name }}"
    # -- OIDC Realm
    oidc_realm: "rspy"
    # -- OIDC CLient ID
    oidc_client_id: "apikeymanager"
    # -- OIDC Secret used to sync user info from Keycloak
    oidc_client_secret: "{{ apikeymanager_oidc_client_secret }}"
    # -- Random string used to encode cookie-based HTTP sessions in SessionMiddleware
    cookie_secret: "{{ rsserver_cookieSecret }}"

ingress:
  # -- Enabled/Disable ingress
  enabled: true
  issuer:
    # -- Ingress Issuer type
    type: cluster-issuer
    # -- Ingress Issuer name
    name: "{{ cluster_issuer }}"
  # -- Ingress host name
  host: {{ rs_server.full_domain }}
  # -- Ingress path
  path:
    - /prip

resources:
  request:
    # -- Pod memory request
    ram: "256Mi"
    # -- Pod CPU request
    cpu: "100m"
  limit:
    # -- Pod memory limit
    ram: "1000Mi"
    # -- Pod CPU limit
    cpu: "500m"

# -- Pod affinity
affinity:
  nodeAffinity:
   requiredDuringSchedulingIgnoredDuringExecution:
     nodeSelectorTerms:
     - matchExpressions:
       - key: node-role.kubernetes.io/rs_server
         operator: Exists

# -- Pod toleration
tolerations:
  - key: role
    value: rs_server
    effect: NoSchedule

# -- Pod initContainers
initContainers:
  - name: init-check
    image: alpine/curl:latest
    command:
      - /bin/sh
      - -c
      - |
        until test "$(curl -XGET --silent http://alloy.monitoring.svc.cluster.local:12345/-/ready)" = "Alloy is ready."; do echo Alloy is not ready; sleep 2; done; echo Alloy reached

cors:
  # -- A list of origins that should be permitted to make cross-origin requests. Needed for STAC Browser
  origins: https://stac-browser-prip.{{ platform_domain_name }},http://localhost:8080
