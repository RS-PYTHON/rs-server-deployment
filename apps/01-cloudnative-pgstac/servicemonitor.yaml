apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/instance: pgstac-cluster
    app.kubernetes.io/name: cloudnative-pg
    app.kubernetes.io/version: 1.28.1
  name: pgstac-cluster
spec:
  endpoints:
  - interval: 30s
    port: metrics
    scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
    - database
  selector:
    matchLabels:
      cnpg.io/cluster: pgstac-cluster
