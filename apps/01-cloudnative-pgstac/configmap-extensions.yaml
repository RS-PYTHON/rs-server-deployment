apiVersion: v1
kind: ConfigMap
metadata:
  name: pgstac-patch-post-action
data:
  pgstac_extensions_queryables.sh: |-
    psql -X -q -v ON_ERROR_STOP=1 {{ rs_server_catalog.database.name }} <<EOSQL
    SET search_path TO pgstac, public;
    UPDATE pgstac.pgstac_settings
    SET value='on' where name='context';
    EOSQL

    {% for url in rs_server_catalog.extensions %}
    psql -X -q -v ON_ERROR_STOP=1 {{ rs_server_catalog.database.name }} <<EOSQL
    SET search_path TO pgstac, public;
    INSERT INTO stac_extensions (url)
    VALUES
      ('{{ url }}')
    ON CONFLICT DO NOTHING;

    UPDATE pgstac.stac_extensions
    SET content=\$EscapeQuote\$$(cat /opt/pgstac_json_schema/{{ url.split('/')[3:] | join('_') }})\$EscapeQuote\$
    WHERE url='{{ url }}' ;
    EOSQL
    {% endfor %}

    {% for queryable in rs_server_catalog.queryables %}
    psql -X -q -v ON_ERROR_STOP=1 {{ rs_server_catalog.database.name }} <<EOSQL
    SET search_path TO pgstac, public;
    INSERT INTO queryables (name)
    SELECT '{{ queryable }}'
    WHERE NOT EXISTS (
        SELECT 1 FROM queryables WHERE name = '{{ queryable }}'
    );
    EOSQL
    {% endfor %}

    # RSPY-906: search by externalIds, see rs-server services/catalog/rs_server_catalog/data_management/external_ids.py.
    # pgstac >= 0.10 cannot search inside the externalIds list of objects with the standard CQL2 operators, so
    # rs-server-catalog translates the externalIds searches into the external_ids_contains CQL2 operator, that
    # pgstac translates with the SQL template registered in cql2_ops: a jsonb containment (@>) served by the GIN
    # indexes below. The template must be exactly the indexed expression. It is registered again at each
    # deployment, in case a pgstac migration removed it.
    # The index of queryable_index_template makes pgstac see it as an index of items, so that
    # pgstac.maintain_partitions(dropindexes => true) never tries to drop it from the partitions.
    # The externalIds queryable has no property_path: it only lists externalIds in the queryables.
    psql -X -q -v ON_ERROR_STOP=1 {{ rs_server_catalog.database.name }} <<EOSQL
    SET search_path TO pgstac, public;
    INSERT INTO queryables (name, definition)
    SELECT 'externalIds', '{"title": "externalIds", "description": "externalIds", "type": "string"}'
    WHERE NOT EXISTS (
        SELECT 1 FROM queryables WHERE name = 'externalIds'
    );
    -- The pgstac < 0.10 queryable read the tokens computed by external_ids_tokens()
    UPDATE queryables SET property_path = NULL WHERE name = 'externalIds' AND property_path IS NOT NULL;
    DROP FUNCTION IF EXISTS pgstac.external_ids_tokens(jsonb);
    INSERT INTO cql2_ops (op, template)
        VALUES ('external_ids_contains', '(content->''properties''->''externalIds'' @> %s::jsonb)')
        ON CONFLICT (op) DO UPDATE SET template = EXCLUDED.template;
    CREATE INDEX IF NOT EXISTS queryable_index_template_external_ids_idx ON pgstac.queryable_index_template
        USING GIN ((content->'properties'->'externalIds') jsonb_path_ops);
    CREATE INDEX IF NOT EXISTS items_external_ids_idx ON pgstac.items
        USING GIN ((content->'properties'->'externalIds') jsonb_path_ops);
    EOSQL

    psql -X -q -v ON_ERROR_STOP=1 {{ rs_server_catalog.database.name }} <<EOSQL
    SET search_path TO pgstac, public;
    UPDATE queryables
        SET definition = '{
            "type": "string",
            "format": "date-time",
            "pattern": "(\\\\+00:00|Z)$"
        }'::jsonb
        WHERE name = 'expires';
    EOSQL

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: pgstac-download-json-schema
data:
  download.sh: |-
    #!/bin/sh

    {% for url in rs_server_catalog.extensions %}
    url={{ url }} ;
    filename=$(echo ${url} | awk -F'/' '{print $4, $5, $6}' OFS="_") ;
    echo "Downloading ${url} ..." ;
    curl -s --create-dirs --output-dir /opt/pgstac_json_schema/ -o ${filename} ${url} ;
    {% endfor %}
