apiVersion: v1
kind: ConfigMap
metadata:
  name: pgstac-patch-post-action
data:
  pgstac_extensions_queryables.sh: |-
    psql -X -q -v ON_ERROR_STOP=1 {{ .Values.cnpgstac.bootstrap.initdb.database }} <<EOSQL
    SET search_path TO pgstac, public;
    UPDATE pgstac.pgstac_settings
    SET value='on' where name='context';
    EOSQL

    {{- if .Values.cnpgstac.custom }}
    {{- if .Values.cnpgstac.custom.extensions }}

    {{ range .Values.cnpgstac.custom.extensions }}
    psql -X -q -v ON_ERROR_STOP=1 {{ $.Values.cnpgstac.bootstrap.initdb.database }} <<EOSQL
    SET search_path TO pgstac, public;
    INSERT INTO stac_extensions (url)
    VALUES
      ({{ . | squote }})
    ON CONFLICT DO NOTHING;

    UPDATE pgstac.stac_extensions
    SET content=\$EscapeQuote\$$(cat /opt/pgstac_json_schema/{{ join "_" (slice ( . | splitList "/" ) 3 ) }})\$EscapeQuote\$
    WHERE url={{ . | squote }} ;
    EOSQL
    {{ end }}

    {{- end }}

    {{- if .Values.cnpgstac.custom.queryables }}
    {{ range .Values.cnpgstac.custom.queryables }}
    psql -X -q -v ON_ERROR_STOP=1 {{ $.Values.cnpgstac.bootstrap.initdb.database }} <<EOSQL
    SET search_path TO pgstac, public;
    INSERT INTO queryables (name)
    VALUES
      ({{ . | squote }})
    ON CONFLICT DO NOTHING;
    EOSQL
    {{ end }}
    {{- end }}

    {{- end }}

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: pgstac-download-json-schema
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: cnpgstac
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" (dict "value" .Values.commonLabels "context" $) | nindent 4 }}
    {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
data:
  download.sh: |-
    #!/bin/sh
    {{- range .Values.cnpgstac.custom.extensions }}

    url={{ . }} ;
    filename=$(echo ${url} | awk -F'/' '{print $4, $5, $6}' OFS="_") ;
    echo "Downloading ${url} ..." ;
    curl -s --create-dirs --output-dir /opt/pgstac_json_schema/ -o ${filename} ${url} ;

    {{- end }}
