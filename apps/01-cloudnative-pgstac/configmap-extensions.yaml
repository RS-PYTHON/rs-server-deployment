apiVersion: v1
kind: ConfigMap
metadata:
  name: pgstac-patch-post-action
data:
  pgstac_extensions_queryables.sh: |-
    psql -X -q -v ON_ERROR_STOP=1 {{ rs_server_catalog.database.name }} <<EOSQL
    SET search_path TO pgstac, public;
    UPDATE pgstac.pgstac_settings
    SET value='on' where name='context';
    EOSQL

    {% for url in rs_server_catalog.extensions %}
    psql -X -q -v ON_ERROR_STOP=1 {{ rs_server_catalog.database.name }} <<EOSQL
    SET search_path TO pgstac, public;
    INSERT INTO stac_extensions (url)
    VALUES
      ('{{ url }}')
    ON CONFLICT DO NOTHING;

    UPDATE pgstac.stac_extensions
    SET content=\$EscapeQuote\$$(cat /opt/pgstac_json_schema/{{ url.split('/')[3:] | join('_') }})\$EscapeQuote\$
    WHERE url='{{ url }}' ;
    EOSQL
    {% endfor %}

    {% for queryable in rs_server_catalog.queryables %}
    psql -X -q -v ON_ERROR_STOP=1 {{ rs_server_catalog.database.name }} <<EOSQL
    SET search_path TO pgstac, public;
    INSERT INTO queryables (name)
    SELECT '{{ queryable }}'
    WHERE NOT EXISTS (
        SELECT 1 FROM queryables WHERE name = '{{ queryable }}'
    );
    EOSQL
    {% endfor %}

    # https://pforge-exchange2.astrium.eads.net/jira/browse/RSPY-906 , https://github.com/RS-PYTHON/rs-demo/pull/239
    psql -X -q -v ON_ERROR_STOP=1 {{ rs_server_catalog.database.name }} <<EOSQL
    SET search_path TO pgstac, public;
    CREATE OR REPLACE FUNCTION pgstac.external_ids_tokens(ext jsonb) RETURNS jsonb AS \$$
        SELECT CASE
            WHEN ext IS NULL OR jsonb_typeof(ext) <> 'array' THEN '[]'::jsonb
            ELSE COALESCE(
                (
                    SELECT jsonb_agg(DISTINCT token)
                    FROM (
                        SELECT CASE
                            WHEN scheme IS NOT NULL AND scheme <> '' AND value IS NOT NULL AND value <> ''
                            THEN scheme || ':' || value
                        END AS token
                        FROM jsonb_to_recordset(ext) AS x(scheme text, value text)
                        UNION ALL
                        SELECT value
                        FROM jsonb_to_recordset(ext) AS x(scheme text, value text)
                        WHERE value IS NOT NULL AND value <> ''
                        UNION ALL
                        SELECT scheme
                        FROM jsonb_to_recordset(ext) AS x(scheme text, value text)
                        WHERE scheme IS NOT NULL AND scheme <> ''
                    ) tokens
                    WHERE token IS NOT NULL AND token <> ''
                ),
                '[]'::jsonb
            )
        END;
    \$$ LANGUAGE SQL IMMUTABLE;
    EOSQL
    psql -X -q -v ON_ERROR_STOP=1 {{ rs_server_catalog.database.name }} <<EOSQL
    SET search_path TO pgstac, public;
    INSERT INTO queryables (name, definition, property_path)
    SELECT
        'externalIds',
        '{"title": "externalIds", "description": "externalIds", "type": "string"}',
        'pgstac.external_ids_tokens(content->''properties''->''externalIds'')'
    WHERE NOT EXISTS (
        SELECT 1 FROM queryables WHERE name = 'externalIds'
    );
    EOSQL

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: pgstac-download-json-schema
data:
  download.sh: |-
    #!/bin/sh

    {% for url in rs_server_catalog.extensions %}
    url={{ url }} ;
    filename=$(echo ${url} | awk -F'/' '{print $4, $5, $6}' OFS="_") ;
    echo "Downloading ${url} ..." ;
    curl -s --create-dirs --output-dir /opt/pgstac_json_schema/ -o ${filename} ${url} ;
    {% endfor %}
