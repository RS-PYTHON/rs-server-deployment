apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pgstac-cluster
  labels:
    app.kubernetes.io/instance: '{{ app_name }}'
    wait-for-deployment: Ready
spec:
  instances: {{ rs_server_catalog.database.cluster.instances }}

  enableSuperuserAccess: true

  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgis-standard-trixie
    major: 18

  bootstrap:
    initdb:
      database: {{ rs_server_catalog.database.name }}
      owner: {{ rs_server_catalog.database.username }}
      secret:
        name: "{{ rs_server_catalog.database.name }}-database-password"

  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: pgstac

  postgresql:
    parameters:
      # shared_buffers: should be 1/4 of the total RAM
      shared_buffers: "256MB"
      # effective_cache_size: should be 3/4 of the total RAM
      effective_cache_size: "768MB"

  resources:
    requests:
      memory: "256Mi"
      cpu: 100m
    limits:
      memory: "1024Mi"
      cpu: 300m

  storage:
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 8Gi
      volumeMode: Filesystem

  affinity:
    #enablePodAntiAffinity: true
    #podAntiAffinityType: preferred
    #topologyKey: kubernetes.io/hostname
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
            - key: "node-role.kubernetes.io/rs_server"
              operator: Exists
    tolerations:
      - effect: NoSchedule
        key: role
        value: rs_server
