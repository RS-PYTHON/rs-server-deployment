apiVersion: batch/v1
kind: Job
metadata:
  name: init-pgstac-db
spec:
  ttlSecondsAfterFinished: 360
  template:
    spec:
      initContainers:
        - name: download-pgstac-extensions
          image: alpine/curl
          command: ["/scripts/init/download.sh"]
          volumeMounts:
            - name: download-json-schema
              mountPath: /scripts/init/
            - name: pgstac-json-schema
              mountPath: /opt/pgstac_json_schema/
      containers:
        - name: create-pgstac-db
          image: ghcr.io/stac-utils/pgstac-pypgstac:v0.9.11
          command:
            - /bin/sh
            - -c
            - |
              set -xe
              pypgstac pgready --debug &&
              pypgstac migrate &&
              psql << EOF
              GRANT pgstac_read TO {{ rs_server_catalog.database.username }};
              GRANT pgstac_ingest TO {{ rs_server_catalog.database.username }};
              GRANT pgstac_admin TO {{ rs_server_catalog.database.username }};
              ALTER ROLE {{ rs_server_catalog.database.username }} IN DATABASE {{ rs_server_catalog.database.name }} SET search_path TO pgstac, public;
              ALTER DATABASE {{ rs_server_catalog.database.name }} set search_path to pgstac, public;
              EOF
              /bin/sh /scripts/pgstac_extensions_queryables.sh ;
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: pgstac-cluster-superuser
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: pgstac-cluster-superuser
                  key: password
            - name: PGDATABASE
              value: catalog
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: pgstac-cluster-superuser
                  key: port
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: pgstac-cluster-superuser
                  key: host
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: pgstac-cluster-superuser
                  key: username
            - name: POSTGRES_PASS
              valueFrom:
                secretKeyRef:
                  name: pgstac-cluster-superuser
                  key: password
            - name: POSTGRES_HOST_READER
              valueFrom:
                secretKeyRef:
                  name: pgstac-cluster-superuser
                  key: host
            - name: POSTGRES_HOST_WRITER
              valueFrom:
                secretKeyRef:
                  name: pgstac-cluster-superuser
                  key: host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: pgstac-cluster-superuser
                  key: port
            - name: POSTGRES_DBNAME
              value: catalog
          volumeMounts:
            - name: pgstac-json-schema
              mountPath: /opt/pgstac_json_schema/
            - name: patch-post-action
              mountPath: /scripts/pgstac_extensions_queryables.sh
              subPath: pgstac_extensions_queryables.sh
      volumes:
        - name: download-json-schema
          configMap:
            name: pgstac-download-json-schema
            defaultMode: 0744
        - name: patch-post-action
          configMap:
            name: pgstac-patch-post-action
            defaultMode: 0744
        - name: pgstac-json-schema
          emptyDir: {}
      restartPolicy: Never
