apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: rs-dpr-service-mockup
spec:
  cluster:
    name: "{{ rs_dpr_mockup_database_cluster | default('postgresql-cluster') }}"
  name: "{{ rs_dpr_mockup_database_name | default('rs_dpr_mockup') }}"
  owner: '{{ rs_server.database.username }}'
  ensure: present
  databaseReclaimPolicy: retain
  template: template0
